      <text x="1146" y="491" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">@streamer · Twitch</text>
    </g>
    <!-- notch -->
    <rect x="1120" y="174" width="52" height="8" rx="4" fill="#ffffff" fill-opacity="0.2"/>

    <!-- reviewed badge -->
    <g transform="translate(1126,138)">
      <rect width="104" height="30" rx="15" fill="#22c55e"/>
      <path d="M14 15 l5 5 l9 -10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="20" font-size="13" font-weight="800" fill="#fff" letter-spacing="0.5">Reviewed</text>
    </g>
  </g>

  <!-- footer line -->
  <text x="1230" y="600" text-anchor="end" class="sans" font-size="14" fill="#b9b4dd" fill-opacity="0.8">Nothing posts without your approval · every clip credits the streamer</text>
</svg>
