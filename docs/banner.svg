    <!-- stream frame -->
    <g filter="url(#shadow)">
      <rect x="690" y="110" width="340" height="191" rx="14" fill="url(#screen)"/>
    </g>
    <g clip-path="url(#streamClip)">
      <!-- scenery -->
      <path d="M690 270 L760 205 L820 245 L890 175 L960 240 L1030 200 L1030 301 L690 301Z" fill="#ffffff" fill-opacity="0.07"/>
      <circle cx="960" cy="160" r="26" fill="#ff9f43" fill-opacity="0.55"/>
      <!-- facecam -->
      <rect x="898" y="196" width="118" height="92" rx="10" fill="#0c0e2b" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
      <circle cx="957" cy="232" r="17" fill="#ffd9b3"/>
      <path d="M926 288 Q957 248 988 288Z" fill="#ffd9b3"/>
    </g>
    <rect x="690" y="110" width="340" height="191" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    <!-- live badge -->
    <rect x="704" y="124" width="64" height="26" rx="6" fill="#ff2d55"/>
    <circle cx="718" cy="137" r="4.5" fill="#fff"/>
    <text x="728" y="142" font-size="13" font-weight="800" letter-spacing="1" fill="#fff">LIVE</text>
    <text x="1016" y="140" text-anchor="end" font-size="13" font-weight="700" fill="#ffffff" fill-opacity="0.75">3:07:42</text>

    <!-- waveform -->
    <rect x="680" y="338" width="360" height="68" rx="12" fill="#070818" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="690" y="364.3" width="4" height="15.4" rx="2" fill="#6c6aa8" opacity="0.7"/>
    <rect x="697" y="360.9" width="4" height="22.2" rx="2" fill="#6c6aa8" opacity="0.7"/>
    <rect x="704" y="356.0" width="4" height="32.0" rx="2" fill="#6c6aa8" opacity="0.7"/>
    <rect x="711" y="356.2" width="4" height="31.5" rx="2" fill="#6c6aa8" opacity="0.7"/>
    <rect x="718" y="352.7" width="4" height="38.6" rx="2" fill="#6c6aa8" opacity="0.7"/>
    <rect x="725" y="354.0" width="4" height="35.9" rx="2" fill="#6c6aa8" opacity="0.7"/>
    <rect x="732" y="357.2" width="4" height="29.6" rx="2" fill="#6c6aa8" opacity="0.7"/>
    <rect x="739" y="358.3" width="4" height="27.4" rx="2" fill="#6c6aa8" opacity="0.7"/>
    <rect x="746" y="362.7" width="4" height="18.6" rx="2" fill="#6c6aa8" opacity="0.7"/>
    <rect x="753" y="362.2" width="4" height="19.5" rx="2" fill="#6c6aa8" opacity="0.7"/>
    <rect x="760" y="359.5" width="4" height="24.9" rx="2" fill="#6c6aa8" opacity="0.7"/>
    <rect x="767" y="357.0" width="4" height="30.0" rx="2" fill="#6c6aa8" opacity="0.7"/>
    <rect x="774" y="353.7" width="4" height="36.6" rx="2" fill="#6c6aa8" opacity="0.7"/>
    <rect x="781" y="351.1" width="4" height="41.9" rx="2" fill="#6c6aa8" opacity="0.7"/>
    <rect x="788" y="356.0" width="4" height="32.0" rx="2" fill="#6c6aa8" opacity="0.7"/>
    <rect x="795" y="357.7" width="4" height="28.6" rx="2" fill="#6c6aa8" opacity="0.7"/>
    <rect x="802" y="350.5" width="4" height="43.0" rx="2" fill="#FFD60A" opacity="1"/>
    <rect x="809" y="356.0" width="4" height="32.1" rx="2" fill="#FFD60A" opacity="1"/>
    <rect x="816" y="359.4" width="4" height="25.1" rx="2" fill="#FFD60A" opacity="1"/>
    <rect x="823" y="357.0" width="4" height="29.9" rx="2" fill="#FFD60A" opacity="1"/>
    <rect x="830" y="358.7" width="4" height="26.5" rx="2" fill="#FFD60A" opacity="1"/>
    <rect x="837" y="351.8" width="4" height="40.4" rx="2" fill="#FFD60A" opacity="1"/>
