    <rect x="914" y="355.3" width="4" height="33.4" rx="2" fill="#6c6aa8" opacity="0.7"/>
    <rect x="921" y="359.9" width="4" height="24.3" rx="2" fill="#6c6aa8" opacity="0.7"/>
    <rect x="928" y="364.2" width="4" height="15.7" rx="2" fill="#6c6aa8" opacity="0.7"/>
    <rect x="935" y="359.0" width="4" height="26.0" rx="2" fill="#6c6aa8" opacity="0.7"/>
