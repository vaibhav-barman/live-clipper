<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="live-clipper: paste a stream link, get vertical shorts">
  <title>live-clipper</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0e2b"/>
      <stop offset="0.6" stop-color="#1a1240"/>
      <stop offset="1" stop-color="#34195a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2d55" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff2d55" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23305f"/>
      <stop offset="1" stop-color="#3b2670"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4dcff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="phoneClip"><rect x="1062" y="168" width="168" height="336" rx="26"/></clipPath>
    <clipPath id="streamClip"><rect x="690" y="110" width="340" height="191" rx="14"/></clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace; }
  </style>

  <!-- background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1120" cy="120" r="320" fill="url(#glowB)"/>
  <circle cx="1180" cy="560" r="260" fill="url(#glowA)"/>
  <circle cx="120" cy="620" r="240" fill="url(#glowB)" opacity="0.6"/>

  <!-- ============ left: wording ============ -->
  <g class="sans">
    <!-- kicker pill -->
    <rect x="80" y="128" width="236" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <circle cx="102" cy="145" r="6" fill="#ff2d55"/>
    <text x="118" y="150" font-size="14" font-weight="700" letter-spacing="2" fill="#e9e4ff">CLAUDE CODE PLUGIN</text>

    <text x="76" y="262" font-size="104" font-weight="800" letter-spacing="-3" fill="url(#title)">live-<tspan fill="#FFD60A">clipper</tspan></text>

    <text x="80" y="322" font-size="31" font-weight="600" fill="#ffffff">Paste a stream link.</text>
    <text x="80" y="362" font-size="31" font-weight="600" fill="#ffffff">Get vertical shorts, <tspan fill="#FFD60A">ready to post.</tspan></text>

    <text x="80" y="406" font-size="20" fill="#b9b4dd">Cut on the waveform. Captioned. Reviewed by a second model.</text>
  </g>

  <!-- command chip -->
  <g class="mono">
    <rect x="80" y="438" width="520" height="52" rx="12" fill="#070818" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="102" y="470" font-size="18" fill="#7c5cff">$</text>
    <text x="124" y="470" font-size="18" fill="#f4f1ff">/live-clipper:live-clipper <tspan fill="#FFD60A">&lt;stream-link&gt;</tspan></text>
  </g>

  <!-- stat row -->
  <g class="sans" font-size="15" font-weight="700" letter-spacing="0.5">
    <g transform="translate(80,534)">
      <rect width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="59" y="22" text-anchor="middle" fill="#ffffff">15 agents</text>
    </g>
    <g transform="translate(210,534)">
      <rect width="108" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="54" y="22" text-anchor="middle" fill="#ffffff">13 skills</text>
    </g>
    <g transform="translate(330,534)">
      <rect width="140" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="70" y="22" text-anchor="middle" fill="#ffffff">1 MCP server</text>
    </g>
    <g transform="translate(482,534)">
      <rect width="118" height="34" rx="17" fill="#FFD60A" fill-opacity="0.14" stroke="#FFD60A" stroke-opacity="0.5"/>
      <text x="59" y="22" text-anchor="middle" fill="#FFD60A">1080×1920</text>
    </g>
  </g>

