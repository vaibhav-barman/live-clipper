    <rect x="998" y="357.9" width="4" height="28.2" rx="2" fill="#6c6aa8" opacity="0.7"/>
    <rect x="1005" y="353.3" width="4" height="37.4" rx="2" fill="#6c6aa8" opacity="0.7"/>
    <rect x="1012" y="354.3" width="4" height="35.5" rx="2" fill="#6c6aa8" opacity="0.7"/>
    <rect x="1019" y="351.8" width="4" height="40.4" rx="2" fill="#6c6aa8" opacity="0.7"/>
    <!-- cut brackets -->
    <path d="M796 340 V404 M796 340 H806 M796 404 H806" stroke="#FFD60A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M908 340 V404 M908 340 H898 M908 404 H898" stroke="#FFD60A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="852.0" y="430" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="1.5" fill="#FFD60A">✂ CUT</text>

    <!-- flow arrow from cut to phone -->
    <path d="M912 372 C 960 372, 990 420, 1050 420" fill="none" stroke="#FFD60A" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
    <path d="M1042 411 L1056 420 L1042 429Z" fill="#FFD60A"/>

    <!-- phone -->
    <g filter="url(#shadow)">
      <rect x="1054" y="160" width="184" height="352" rx="32" fill="#ffffff"/>
    </g>
    <rect x="1062" y="168" width="168" height="336" rx="26" fill="#0c0e2b"/>
    <g clip-path="url(#phoneClip)">
      <!-- gameplay half -->
      <rect x="1062" y="168" width="168" height="168" fill="url(#screen)"/>
      <path d="M1062 320 L1100 262 L1134 296 L1176 236 L1230 300 L1230 336 L1062 336Z" fill="#ffffff" fill-opacity="0.08"/>
      <circle cx="1196" cy="212" r="16" fill="#ff9f43" fill-opacity="0.55"/>
      <!-- facecam half -->
      <rect x="1062" y="336" width="168" height="168" fill="#171238"/>
      <circle cx="1146" cy="400" r="30" fill="#ffd9b3"/>
      <path d="M1096 504 Q1146 428 1196 504Z" fill="#ffd9b3"/>
      <!-- caption -->
      <text x="1146" y="352" text-anchor="middle" font-size="30" font-weight="900" stroke="#0c0e2b" stroke-width="7" stroke-linejoin="round" paint-order="stroke" fill="#FFD60A" letter-spacing="0.5">NO WAY</text>
      <!-- credit strip -->
